<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metin Seslendirme (Text-to-Speech)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
        }
        textarea {
            width: 100%;
            height: 180px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            resize: vertical;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-play { background-color: #2ecc71; color: white; }
        .btn-play:hover { background-color: #27ae60; }
        .btn-pause { background-color: #f39c12; color: white; }
        .btn-pause:hover { background-color: #d35400; }
        .btn-stop { background-color: #e74c3c; color: white; }
        .btn-stop:hover { background-color: #c0392b; }
    </style>
</head>
<body>

    <h2>Metin Seslendirme</h2>
    <textarea id="textInput" placeholder="Okunmasını istediğiniz metni buraya yazın..."></textarea>
    
    <div class="controls">
        <button class="btn-play" onclick="speakText()">Oku / Devam Et</button>
        <button class="btn-pause" onclick="pauseSpeech()">Duraklat</button>
        <button class="btn-stop" onclick="stopSpeech()">Durdur</button>
    </div>

    <script>
        const synth = window.speechSynthesis;

        function speakText() {
            // Eğer duraklatılmışsa devam ettir
            if (synth.paused && synth.speaking) {
                synth.resume();
                return;
            }

            // Zaten konuşuyorsa tekrar başlatma
            if (synth.speaking) return;

            const text = document.getElementById("textInput").value.trim();
            if (!text) {
                alert("Lütfen seslendirilecek bir metin girin.");
                return;
            }

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = "tr-TR"; // Türkçe dil ayarı
            utterance.rate = 1.0;     // Okuma hızı (0.1 - 10 arası)
            utterance.pitch = 1.0;    // Ses tonu (0 - 2 arası)

            synth.speak(utterance);
        }

        function pauseSpeech() {
            if (synth.speaking) {
                synth.pause();
            }
        }

        function stopSpeech() {
            if (synth.speaking || synth.paused) {
                synth.cancel();
            }
        }
    </script>

</body>
</html>

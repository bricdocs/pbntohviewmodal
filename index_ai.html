<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Briç PBN Stüdyo Mobil (Güncel)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 10px auto; padding: 0 12px; background-color: #f1f3f5; color: #212529; font-size: 16px; }
        h2 { font-size: 22px; text-align: center; color: #1a1a1a; margin-top: 15px; }
        .card-container { background: white; padding: 18px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 15px; }
        .input-group { margin-bottom: 18px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #495057; font-size: 16px; }
        
        textarea { width: 100%; padding: 12px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; font-family: monospace; font-size: 15px; }
        .api-area { height: 95px; resize: vertical; }
        .pbn-area { height: 260px; resize: vertical; background: #fff; color: #000; font-size: 16px; font-weight: bold; border: 2px solid #495057; }
        select { width: 100%; padding: 14px; border: 1px solid #ced4da; border-radius: 6px; background: white; font-size: 18px; font-weight: bold; -webkit-appearance: none; }
        
        .btn { padding: 16px 20px; font-size: 18px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; transition: background 0.2s; display: block; box-sizing: border-box; text-align: center; }
        .btn-primary { background-color: #007bff; color: white; box-shadow: 0 3px 6px rgba(0,123,255,0.2); }
        .btn-primary:hover { background-color: #0056b3; }
        .btn-success { background-color: #28a745; color: white; margin-top: 12px; box-shadow: 0 3px 6px rgba(40,167,69,0.2); font-size: 17px; }
        .btn-success:hover { background-color: #218838; }
        button:disabled { background-color: #adb5bd !important; color: #fff !important; cursor: not-allowed; box-shadow: none; }
        
        .status-box { padding: 14px; margin-top: 15px; border-radius: 6px; font-weight: bold; display: none; font-size: 15px; line-height: 1.4; }
        .loading { color: #856404; background-color: #fff3cd; border: 1px solid #ffeeba; }
        .error { color: #721c24; background-color: #f8d7da; border: 1px solid #f5c6cb; white-space: pre-wrap; font-family: monospace; font-size: 13px; font-weight: normal; }
        .success { color: #155724; background-color: #d4edda; border: 1px solid #c3e6cb; }
        
        .badge { display: inline-block; background: #20c997; color: white; padding: 4px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; }
        .file-list { margin-top: 10px; font-size: 14px; color: #495057; background: #e9ecef; padding: 12px; border-radius: 6px; line-height: 1.6; }
        
        .file-input-wrapper { border: 2px dashed #007bff; padding: 20px 10px; border-radius: 8px; background: #f8f9fa; text-align: center; cursor: pointer; position: relative; }
        .file-input-wrapper input[type="file"] { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
        .file-input-text { font-size: 16px; color: #007bff; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Briç El Görsellerini PBN'e Çevir</h2>
    
    <div class="card-container">
        <div class="input-group">
            <label for="apiKeys">Gemini API Anahtarları (Her satıra bir adet):</label>
            <textarea id="apiKeys" class="api-area" placeholder="AIzaSy... (İlk Anahtar)&#10;AIzaSy... (Yedek Anahtar)" oninput="saveKeysToStorage()"></textarea>
        </div>
        
        <div class="input-group">
            <label for="boardNo">Board No (El Numarası Seçin):</label>
            <select id="boardNo">
                <!-- 1'den 40'a kadar JavaScript ile doldurulacak -->
            </select>
        </div>

        <div class="input-group">
            <label>4 Yönün Fotoğrafını Seçin (N, E, S, W):</label>
            <div class="file-input-wrapper">
                <span class="file-input-text">📸 Fotoğrafları Toplu Seçin</span>
                <input type="file" id="imgBulk" accept="image/*" multiple onchange="handleFileSelect()">
            </div>
            <div id="fileListDisplay" class="file-list">Henüz fotoğraf seçilmedi. Cep telefonunuzdan 4 fotoğraf birden seçebilirsiniz.</div>
        </div>

        <button id="btnProcess" class="btn btn-primary" onclick="processImages()">PBN ÜRET</button>
        <div id="statusMessage" class="status-box"></div>
    </div>

    <div class="card-container">
        <div style="margin-bottom: 12px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; font-size: 15px;">
            <span>Sonuç PBN (Kutuya tıklayıp düzenleyebilirsiniz):</span>
            <div>Başarılı: <span id="requestCounter" class="badge">0</span></div>
        </div>
        <textarea id="output" class="pbn-area" placeholder="PBN verisi buraya gelecek. Hatalı kart çıkarsa üzerine tıklayıp klavyenizle düzeltebilirsiniz."></textarea>
        <button id="btnDownload" class="btn btn-success" onclick="downloadPBN()" disabled>📥 PBN DOSYASINI TELEFONA İNDİR</button>
    </div>

    <script>
        let detectedFiles = { north: null, east: null, south: null, west: null };
        let successfulRequests = 0;
        let currentKeyIndex = 0;

        window.addEventListener('DOMContentLoaded', () => {
            const select = document.getElementById('boardNo');
            for (let i = 1; i <= 40; i++) {
                let opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `Board ${i}`;
                select.appendChild(opt);
            }
            const savedKeys = localStorage.getItem('bridge_gemini_api_keys');
            if (savedKeys) {
                document.getElementById('apiKeys').value = savedKeys;
            }
        });

        function saveKeysToStorage() {
            const keys = document.getElementById('apiKeys').value;
            localStorage.setItem('bridge_gemini_api_keys', keys);
        }

        function handleFileSelect() {
            const files = document.getElementById('imgBulk').files;
            const display = document.getElementById('fileListDisplay');
            display.innerHTML = "";
            detectedFiles = { north: null, east: null, south: null, west: null };

            if (files.length === 0) { display.textContent = "Henüz fotoğraf seçilmedi."; return; }
            let fileArray = Array.from(files);
            let usedOrder = false;

            if (fileArray.length === 4) {
                fileArray.forEach(file => {
                    const name = file.name.toLowerCase();
                    if (name.includes('north') || name.includes('kuzey')) detectedFiles.north = file;
                    else if (name.includes('east') || name.includes('dogu') || name.includes('doğu')) detectedFiles.east = file;
                    else if (name.includes('south') || name.includes('guney') || name.includes('güney')) detectedFiles.south = file;
                    else if (name.includes('west') || name.includes('bati') || name.includes('batı')) detectedFiles.west = file;
                });
            }

            if (!detectedFiles.north || !detectedFiles.east || !detectedFiles.south || !detectedFiles.west) {
                detectedFiles.north = files[0] || null;
                detectedFiles.east = files[1] || null;
                detectedFiles.south = files[2] || null;
                detectedFiles.west = files[3] || null;
                usedOrder = true;
            }

            display.innerHTML = `
                <strong>Dağılım Durumu:</strong><br>
                ⚫ N (Kuzey): ${detectedFiles.north ? '✅ ' + detectedFiles.north.name : '❌ Seçilmedi'}<br>
                ⚫ E (Doğu): ${detectedFiles.east ? '✅ ' + detectedFiles.east.name : '❌ Seçilmedi'}<br>
                ⚫ S (Güney): ${detectedFiles.south ? '✅ ' + detectedFiles.south.name : '❌ Seçilmedi'}<br>
                ⚫ W (Batı): ${detectedFiles.west ? '✅ ' + detectedFiles.west.name : '❌ Seçilmedi'}
                ${usedOrder && files.length === 4 ? '<br><span style="color:#d63031; font-weight:bold;">⚠️ Yönler dosya isminden ayırt edilemedi, seçim sırasına (N,E,S,W) göre dizildi.</span>' : ''}
            `;
        }

                const fileToGenerativePart = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => {
                    const base64Data = reader.result.split(',')[1];
                    resolve({
                        inlineData: {
                            data: base64Data,
                            mimeType: file.type
                        },
                    });
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        };

        function updateStatus(text, type) {
            const statusBox = document.getElementById('statusMessage');
            statusBox.style.display = 'block';
            statusBox.className = 'status-box ' + type;
            statusBox.textContent = text;
        }

        async function processImages() {
            const keysInput = document.getElementById('apiKeys').value.trim();
            const outElement = document.getElementById('output');
            const button = document.getElementById('btnProcess');
            const downloadButton = document.getElementById('btnDownload');
            const boardSelect = document.getElementById('boardNo');
            
            const apiKeys = keysInput.split('\n').map(k => k.trim()).filter(k => k.length > 0);
            let errorLogHistory = "";

            if (apiKeys.length === 0) {
                alert('Lütfen en az bir geçerli Gemini API anahtarı girin.');
                return;
            }

            if (!detectedFiles.north || !detectedFiles.east || !detectedFiles.south || !detectedFiles.west) {
                alert('Lütfen 4 yönün de fotoğrafını içerdiğinden emin olun (Tam 4 fotoğraf seçmelisiniz).');
                return;
            }

            try {
                button.disabled = true;
                downloadButton.disabled = true;
                outElement.value = "";
                updateStatus("Görseller telefonda işleniyor ve hazırlanıyor...", "loading");

                const promptParts = [
                    await fileToGenerativePart(detectedFiles.north),
                    await fileToGenerativePart(detectedFiles.east),
                    await fileToGenerativePart(detectedFiles.south),
                    await fileToGenerativePart(detectedFiles.west),
                    {
                        text: `Sana sırasıyla Kuzey, Doğu, Güney ve Batı oyuncularının briç masasındaki ellerinin fotoğraflarını gönderdim. Lütfen bu görsellerdeki kartları analiz et ve briç standartlarına uygun bir PBN (Portable Bridge Notation) formatı üret. Çıktıda sadece geçerli PBN kod bloğu yer alsın, ekstra açıklama veya metin yazma. 10'lu kartlar için 'T' harfini kullan.`
                    }
                ];

                const protocol = "https://";
                const domain = "generativelanguage";
                const tld = ".googleapis.com";
                const path = "/v1beta/models/gemini-3.6-flash:generateContent";
                
                let success = false;
                let response;

                while (currentKeyIndex < apiKeys.length && !success) {
                    const activeKey = apiKeys[currentKeyIndex];
                    const url = protocol + domain + tld + path + "?key=" + activeKey;
                    
                    let retries = 3; 
                    let delay = 3000;

                    while (retries >= 0) {
                        try {
                            updateStatus(`İstek gönderiliyor... Anahtar: ${currentKeyIndex + 1}/${apiKeys.length} (Deneme: ${4 - retries}/4)`, "loading");
                            
                            response = await fetch(url, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ contents: [{ parts: promptParts }] })
                            });

                            if (response.status === 503) {
                                errorLogHistory += `⚠️ Anahtar ${currentKeyIndex + 1} (Deneme ${4 - retries}): 503 Yoğunluk Hatası Alındı.\n`;
                                if (retries === 0) throw new Error("503");
                                updateStatus(`Sunucu yoğun (503 Hatası). ${delay / 1000} saniye içinde tekrar deneniyor...`, "loading");
                                await new Promise(res => setTimeout(res, delay));
                                retries--;
                                delay *= 2;
                                continue;
                            }

                            if (!response.ok) {
                                const errJson = await response.json().catch(() => ({}));
                                const rawMessage = errJson.error ? `${errJson.error.status} - ${errJson.error.message}` : "Bilinmeyen Sunucu Hatası";
                                errorLogHistory += `❌ Anahtar ${currentKeyIndex + 1}: Sunucu Hata Kodu ${response.status} (${rawMessage})\n`;
                                throw new Error(`API_ERROR`);
                            }

                            success = true;
                            break;

                        } catch (err) {
                            if (err.message === "503" || err.message === "API_ERROR") {
                                break; 
                            }
                            errorLogHistory += `🌐 Anahtar ${currentKeyIndex + 1}: Bağlantı/Ağ Hatası.\n`;
                            if (retries === 0) throw err;
                            await new Promise(res => setTimeout(res, delay));
                            retries--;
                        }
                    }

                    if (!success) {
                        currentKeyIndex++; 
                    }
                }

                if (!success) {
                    currentKeyIndex = 0; 
                    throw new Error(`Havuzdaki tüm API anahtarları tükendi. Sunucudan dönen ham detaylar:\n\n${errorLogHistory}`);
                }

                const result = await response.json();
                
                // Referans kod uyarınca [0] indeksleri geri eklenerek veri okuma sağlama alındı
                if (result && result.candidates && result.candidates[0] && result.candidates[0].content && result.candidates[0].content.parts && result.candidates[0].content.parts[0]) {
                    let pbnResult = result.candidates[0].content.parts[0].text;
                    pbnResult = pbnResult.replace(/```pbn/g, '').replace(/```/g, '').trim();
                    
                    const selectedBoard = boardSelect.value;
                    pbnResult = pbnResult.replace(/\[Board\s+"[^"]*"\]/g, `[Board "${selectedBoard}"]`);
                    
                    outElement.value = pbnResult;
                    
                    successfulRequests++;
                    document.getElementById('requestCounter').textContent = successfulRequests;
                    downloadButton.disabled = false;
                    
                    updateStatus(`Başarıyla tamamlandı! (Kullanılan Anahtar Sırası: ${currentKeyIndex + 1})`, "success");
                } else {
                    outElement.value = JSON.stringify(result, null, 2);
                    updateStatus("API yanıt verdi ancak veri şablonu çözülemedi.", "error");
                }

            } catch (error) {
                console.error(error);
                outElement.value = "İşlem durduruldu. Detaylar üstteki kutuda yer almaktadır.";
                updateStatus(error.message, "error");
            } finally {
                button.disabled = false;
            }
        }

        function downloadPBN() {
            const pbnContent = document.getElementById('output').value;
            const boardSelect = document.getElementById('boardNo');
            const selectedBoard = boardSelect.value;

            if (!pbnContent.trim()) {
                alert("İndirilecek PBN verisi bulunamadı.");
                return;
            }

            let finalContent = pbnContent.replace(/\[Board\s+"[^"]*"\]/g, `[Board "${selectedBoard}"]`);

            const blob = new Blob([finalContent], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement('a');
            link.href = url;
            link.download = `bric_el_board_${selectedBoard}.pbn`;
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
